services:
  postgres:
    image: postgres:17
    container_name: shut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shut
      POSTGRES_USER: shut_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shut_user -d shut" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
