<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
:root{--ink:#4b3f63;--hint:#8d82a6;--chip:#fff;--chip-ink:#6a4cc0;--err:#d6456b;--bg:#f6f0ff;
--t1:#ffe1eb;--e1:#f2c4d4;--t2:#e8deff;--e2:#cdbff2;--t3:#d8f5e7;--e3:#b4e0c9;--t4:#ffe8d4;--e4:#f0cdb0;--t5:#dbeeff;--e5:#b9d6f2}
@media (prefers-color-scheme:dark){:root{--ink:#f1ecfb;--hint:#b6abd0;--chip:#3b3260;--chip-ink:#dccdff;--err:#ff8fae;--bg:#272244;
--t1:#4a3050;--e1:#39243f;--t2:#3d3668;--e2:#2e2850;--t3:#2f4a4a;--e3:#233a3a;--t4:#4f3f3f;--e4:#3d3030;--t5:#2f4260;--e5:#243349}}
*{box-sizing:border-box}
body{margin:0;padding:0;color:var(--ink);background:var(--bg)}
.w{padding:14px 12px 12px}
.h{display:flex;direction:ltr;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:0 4px}
.h h3{flex:1;margin:0;direction:rtl;text-align:right;font-size:1.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{flex:none;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:.88em;font-weight:bold;white-space:nowrap}
.p.z{color:var(--hint);font-weight:normal}
.o{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 8px;padding:14px 16px;border:0;border-radius:18px;background:var(--tile);box-shadow:0 2px 0 var(--edge);color:inherit;font:inherit;font-weight:bold;text-align:right}
.o:nth-of-type(1){--tile:var(--t1);--edge:var(--e1)}.o:nth-of-type(2){--tile:var(--t2);--edge:var(--e2)}.o:nth-of-type(3){--tile:var(--t3);--edge:var(--e3)}.o:nth-of-type(4){--tile:var(--t4);--edge:var(--e4)}.o:nth-of-type(5){--tile:var(--t5);--edge:var(--e5)}
.o:disabled{color:var(--hint)}
.i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.2em}
.x{text-align:center;color:var(--err);font-size:.85em;margin:4px 0 0}
</style>
</head>
<body>
<div class="w" id="m"></div>
<script>
const W=window.TelegramWidget,M=document.getElementById('m');
const OPT=[['👤','پروفایل','o:profile'],['📅','تقویم کاری','o:calendar'],['💰','تعرفه‌ها','o:prices'],['🖼','ویترین','o:showcase'],['⭐','نظرها','o:reviews']];
let S,B,E;
const fs=n=>(n/10).toLocaleString('fa-IR',{minimumFractionDigits:1,maximumFractionDigits:1});
const P=s=>{try{return JSON.parse(s)}catch(e){return null}};
function h(t,c,x,p){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e}
function draw(){
 M.textContent='';
 if(!S){h('p','x',E?'خطا در دریافت اطلاعات':'در حال بارگذاری…',M);return}
 const t=h('div','h',null,M);
 h('span',S.r?'p':'p z',S.r?'⭐ '+fs(S.r):'بدون امتیاز',t);
 h('h3','',S.h,t);
 OPT.forEach(o=>{const b=h('button','o',null,M);b.dataset.q=o[2];b.disabled=!!B;h('span','i',o[0],b);h('span','',o[1],b)});
 if(E)h('p','x',E==='RATE_LIMITED'?'کمی صبر کنید':'خطا، دوباره امتحان کنید',M);
}
function ask(d){
 W.request(d).then(()=>{B=0;draw()},e=>{B=0;E=e.code;draw()});
 B=1;E='';draw()
}
M.addEventListener('click',e=>{
 let t=e.target;
 while(t&&!(t.dataset&&t.dataset.q))t=t.parentNode;
 if(t&&!t.disabled&&W&&!B)ask(t.dataset.q)
});
if(W){
 W.onEvent('chatDataChanged',()=>{const s=P(W.chatData);if(s){S=s;E='';draw()}});
 S=P(W.chatData);draw();
 W.ready()
}else draw();
</script>
</body>
</html>
