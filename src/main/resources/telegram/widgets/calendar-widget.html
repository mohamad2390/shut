<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
:root{--ink:#4b3f63;--hint:#8d82a6;--chip:#fff;--chip-ink:#6a4cc0;--err:#d6456b;--ok:#1f7a52;--shadow:0 2px 6px rgba(120,90,170,.14);
--cell:#fbf8ff;--cell-edge:#ece6f7;--free:#d8f5e7;--free-edge:#bfe8d2;--busy:#ffe1eb;--busy-edge:#f6c3d3;--past:#f4effa;
--bg1:#fff1f6;--bg2:#f2edff;--bg3:#e4f4ff}
@media (prefers-color-scheme:dark){:root{--ink:#f1ecfb;--hint:#b6abd0;--chip:rgba(255,255,255,.14);--chip-ink:#dccdff;--err:#ff8fae;--ok:#8ff0c0;--shadow:0 2px 6px rgba(0,0,0,.3);
--cell:#342b50;--cell-edge:#2a2242;--free:#2c5249;--free-edge:#23423b;--busy:#5b3050;--busy-edge:#47253f;--past:#2c2545;
--bg1:#2d2244;--bg2:#27244a;--bg3:#1f2e49}}
*{box-sizing:border-box}
body{margin:0;padding:0;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.w{padding:14px 22px 10px}
h3{margin:0 0 10px;font-size:1.12em;text-align:right}
h3::before{content:'📅 '}
.b{direction:ltr;display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px}
.b button{flex:none;border:0;border-radius:999px;padding:9px 16px;background:var(--chip);color:var(--chip-ink);font:inherit;font-weight:bold;box-shadow:var(--shadow)}
.b button:active{transform:scale(.96)}
.b button:disabled{opacity:.4}
.b span{min-width:0;font-weight:bold;text-align:center}
@media (max-width:260px){.b{flex-wrap:wrap}.b span{order:-1;flex-basis:100%}.c small{display:none}}
.g{direction:ltr;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:420px;margin:0 auto}
.d{text-align:center;color:var(--hint);font-size:.8em;padding:2px 0}
.d.h{color:var(--err)}
.c{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--cell);box-shadow:0 2px 0 var(--cell-edge);font-weight:bold;line-height:1.15}
.c small{font-size:.58em;line-height:1}
.c.f{background:var(--free);color:var(--ok);box-shadow:0 2px 0 var(--free-edge)}
.c.u{background:var(--busy);color:var(--err);box-shadow:0 2px 0 var(--busy-edge)}
.c.o{background:var(--past);color:var(--hint);box-shadow:none;font-weight:normal}
.c.t{box-shadow:inset 0 0 0 2px var(--chip-ink)}
.k{direction:rtl;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin:12px 0 2px;color:var(--hint);font-size:.82em}
.k i{display:inline-block;width:11px;height:11px;border-radius:4px;vertical-align:-1px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--hint)}
.k i.f{background:var(--free);box-shadow:none}
.k i.u{background:var(--busy);box-shadow:none}
.e{text-align:center;color:var(--hint);padding:12px 0 4px;font-size:.88em}
.x{text-align:center;color:var(--err);font-size:.85em;margin:8px 0 0}
</style>
</head>
<body>
<div class="w" id="m"></div>
<script>
const W=window.TelegramWidget,M=document.getElementById('m'),N=['ش','ی','د','س','چ','پ','ج'];
let S,B,E;
const fa=n=>Number(n).toLocaleString('fa-IR');
const P=s=>{try{return JSON.parse(s)}catch(e){return null}};
function h(t,c,x,p){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e}
function go(y,o,d){const q=o+d;return 'm:'+(q<1?y-1:q>12?y+1:y)+':'+(q<1?12:q>12?1:q)}
function draw(){
 M.textContent='';
 if(!S){h('p','e',E?'خطا در دریافت اطلاعات':'در حال بارگذاری…',M);return}
 if(!S.n){h('p','e',S.h,M);return}
 h('h3','',S.h,M);
 const g=h('div','g',null,M);
 const at=(e,p)=>{e.style.gridColumn=7-p%7;e.style.gridRow=1+Math.floor(p/7)};
 N.forEach((x,i)=>at(h('div',i>5?'d h':'d',x,g),i));
 let f=0,u=0;
 for(let i=1;i<=S.n;i++){
  const q=!(S.t&&i<S.t);
  const k=S.s[i-1],c=h('div','c'+(k==='1'?' f':k==='2'?' u':'')+(S.t&&i<S.t?' o':'')+(i===S.t?' t':''),null,g);
  at(c,S.w+i-1+7);
  h('span','',fa(i),c);
  if(k==='1'){if(q){f++;h('small','','✓',c)}}else if(k==='2'){if(q){u++;h('small','','✕',c)}}
 }
 const k=h('div','k',null,M);
 [['f','آزاد',f],['u','پر',u],['','نامشخص',S.n-(S.t?S.t-1:0)-f-u]].forEach(x=>{const s=h('span','',null,k);h('i',x[0],null,s);s.append(' '+x[1]+' ('+fa(x[2])+')')});
 const b=h('div','b',null,M);
 const bt=(l,d,off)=>{const x=h('button','',l,b);x.dataset.q=go(S.y,S.o,d);x.disabled=!!off||!!B};
 bt('ماه بعد',1,!S.z);h('span','',S.l,b);bt('ماه قبل',-1,!S.a);
 if(!/[12]/.test(S.s))h('p','e','این ماه هنوز وضعیتی مشخص نشده.',M);
 if(E)h('p','x',E==='RATE_LIMITED'?'کمی صبر کنید':'خطا ('+E+')، دوباره امتحان کنید',M);
}
function ask(d){
 W.request(d).then(a=>{B=0;const s=a.result&&P(a.result);E=s?'':'EMPTY';if(s)S=s;draw()},e=>{B=0;E=e.code||'x';draw()});
 B=1;draw()
}
M.addEventListener('click',e=>{
 let t=e.target;
 while(t&&!(t.dataset&&t.dataset.q))t=t.parentNode;
 if(t&&!t.disabled&&W&&!B)ask(t.dataset.q)
});
if(W){
 W.onEvent('chatDataChanged',()=>{const s=P(W.chatData);if(s){S=s;E='';draw()}});
 S=P(W.chatData);draw();
 if(!S)W.request('i').then(a=>{const s=a.result&&P(a.result);if(s){S=s;draw()}},()=>{E='x';draw()});
 W.ready()
}else draw();
</script>
</body>
</html>
