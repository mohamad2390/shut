<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
:root{--ink:#4b3f63;--hint:#8d82a6;--chip:#fff;--chip-ink:#6a4cc0;--star:#f0a500;--err:#d6456b;--bg:#f6f0ff;
--t1:#ffe1eb;--e1:#f2c4d4;--t2:#e8deff;--e2:#cdbff2;--t3:#d8f5e7;--e3:#b4e0c9}
@media (prefers-color-scheme:dark){:root{--ink:#f1ecfb;--hint:#b6abd0;--chip:#3b3260;--chip-ink:#dccdff;--star:#ffcc4d;--err:#ff8fae;--bg:#272244;
--t1:#4a3050;--e1:#39243f;--t2:#3d3668;--e2:#2e2850;--t3:#2f4a4a;--e3:#233a3a}}
*{box-sizing:border-box}
body{margin:0;padding:0;color:var(--ink);background:var(--bg)}
.w{padding:14px 12px 10px}
.h{display:flex;direction:ltr;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:0 4px}
.h h3{flex:1;margin:0;direction:rtl;text-align:right;font-size:1.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h h3::before{content:'⭐ '}
.p{flex:none;direction:rtl;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:.88em;font-weight:bold;white-space:nowrap}
.p.z{color:var(--hint);font-weight:normal}
.r{margin:0 0 8px;padding:10px 14px;border-radius:18px;background:var(--tile);box-shadow:0 2px 0 var(--edge)}
.r:nth-child(3n+1){--tile:var(--t1);--edge:var(--e1)}.r:nth-child(3n+2){--tile:var(--t2);--edge:var(--e2)}.r:nth-child(3n+3){--tile:var(--t3);--edge:var(--e3)}
.t{display:flex;direction:ltr;align-items:center;justify-content:space-between;gap:10px}
.s{flex:none;color:var(--star);letter-spacing:1px;white-space:nowrap}
.n{flex:1;min-width:0;direction:rtl;text-align:right;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{margin:6px 0 0;line-height:1.7;font-size:.92em}
.e{text-align:center;color:var(--hint);padding:20px 0}
.x{text-align:center;color:var(--err);font-size:.85em;margin:0 0 4px}
.f{display:flex;direction:ltr;align-items:center;justify-content:center;gap:10px;padding:4px 0 max(4px,env(safe-area-inset-bottom))}
.f button{border:0;border-radius:999px;padding:8px 16px;background:var(--chip);color:var(--chip-ink);font:inherit;font-weight:bold;box-shadow:0 2px 0 var(--e2)}
.f button:disabled{color:var(--hint)}
.f span{direction:rtl;color:var(--hint);font-size:.85em;white-space:nowrap}
</style>
</head>
<body>
<div class="w" id="m"></div>
<script>
const W=window.TelegramWidget,M=document.getElementById('m');
let S,B,E;
const fa=n=>Number(n).toLocaleString('fa-IR');
const fs=n=>(n/10).toLocaleString('fa-IR',{minimumFractionDigits:1,maximumFractionDigits:1});
const P=s=>{try{return JSON.parse(s)}catch(e){return null}};
function h(t,c,x,p){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e}
function draw(){
 M.textContent='';
 if(!S){h('p','e',E?'خطا در دریافت اطلاعات':'در حال بارگذاری…',M);return}
 const t=h('div','h',null,M);
 h('span',S.r?'p':'p z',S.r?fs(S.r)+' ('+fa(S.n)+' نظر)':'بدون امتیاز',t);
 h('h3','','نظرهای '+S.h,t);
 const L=S.i||[];
 if(!L.length)h('p','e','هنوز نظری ثبت نشده است.',M);
 const G=h('div','',null,M);
 L.forEach(x=>{
  const r=h('div','r',null,G),a=h('div','t',null,r);
  h('span','s','★'.repeat(x[1])+'☆'.repeat(5-x[1]),a);
  h('span','n',x[0],a);
  if(x[2])h('p','c',x[2],r)
 });
 if(E)h('p','x',E==='RATE_LIMITED'?'کمی صبر کنید':'خطا، دوباره امتحان کنید',M);
 if(S.c>1){
  const f=h('div','f',null,M);
  const bt=(l,q,d)=>{const b=h('button','',l,f);b.dataset.q=q;b.disabled=!!d||!!B};
  bt('بعدی','p:'+(S.p+1),S.p>=S.c);h('span','',fa(S.p)+' از '+fa(S.c),f);bt('قبلی','p:'+(S.p-1),S.p<2)
 }
}
function ask(d){
 W.request(d).then(a=>{B=0;const s=a.result&&P(a.result);if(s)S=s;draw()},e=>{B=0;E=e.code;draw()});
 B=1;E='';draw()
}
M.addEventListener('click',e=>{
 const t=e.target;
 if(t&&t.dataset&&t.dataset.q&&!t.disabled&&W&&!B)ask(t.dataset.q)
});
if(W){
 W.onEvent('chatDataChanged',()=>{const s=P(W.chatData);if(s){S=s;E='';draw()}});
 S=P(W.chatData);draw();
 if(!S)W.request('i').then(a=>{const s=a.result&&P(a.result);if(s){S=s;draw()}},()=>{E='x';draw()});
 W.ready()
}else draw();
</script>
</body>
</html>
