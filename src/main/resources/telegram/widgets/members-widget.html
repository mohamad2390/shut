<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
:root{--ink:#4b3f63;--hint:#8d82a6;--chip:#fff;--chip-ink:#6a4cc0;--err:#d6456b;--bg:#f6f0ff;
--t1:#ffe1eb;--e1:#f2c4d4;--t2:#e8deff;--e2:#cdbff2;--t3:#d8f5e7;--e3:#b4e0c9;--t4:#ffe8d4;--e4:#f0cdb0;--t5:#dbeeff;--e5:#b9d6f2}
@media (prefers-color-scheme:dark){:root{--ink:#f1ecfb;--hint:#b6abd0;--chip:#3b3260;--chip-ink:#dccdff;--err:#ff8fae;--bg:#272244;
--t1:#4a3050;--e1:#39243f;--t2:#3d3668;--e2:#2e2850;--t3:#2f4a4a;--e3:#233a3a;--t4:#4f3f3f;--e4:#3d3030;--t5:#2f4260;--e5:#243349}}
*{box-sizing:border-box}
body{margin:0;padding:0;color:var(--ink);background:var(--bg)}
.w{padding:14px 12px 10px}
h3{margin:0 0 10px;padding:0 4px;font-size:1.12em}
h3::before{content:'🏅 '}
.r{display:flex;direction:ltr;align-items:center;gap:10px;width:100%;margin:0 0 8px;padding:10px 12px;border:0;border-radius:18px;background:var(--tile);box-shadow:0 2px 0 var(--edge);color:inherit;font:inherit}
.r:disabled{color:inherit}
.r:nth-child(5n+1){--tile:var(--t1);--edge:var(--e1)}.r:nth-child(5n+2){--tile:var(--t2);--edge:var(--e2)}.r:nth-child(5n+3){--tile:var(--t3);--edge:var(--e3)}.r:nth-child(5n+4){--tile:var(--t4);--edge:var(--e4)}.r:nth-child(5n+5){--tile:var(--t5);--edge:var(--e5)}
.p{flex:none;min-width:58px;text-align:center;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:.92em;font-weight:bold;white-space:nowrap}
.p.z{color:var(--hint);font-weight:normal}
.n{flex:none;max-width:48%;min-width:0;direction:rtl;text-align:right}
.k{flex:1;min-width:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;direction:rtl}
.k span{padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:.76em;white-space:nowrap}
.m{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{margin-top:3px;color:var(--hint);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e{text-align:center;color:var(--hint);padding:20px 0}
.x{text-align:center;color:var(--err);font-size:.85em;margin:0 0 4px}
.f{display:flex;direction:ltr;align-items:center;justify-content:center;gap:10px;padding:4px 0 max(4px,env(safe-area-inset-bottom))}
.f button{border:0;border-radius:999px;padding:8px 16px;background:var(--chip);color:var(--chip-ink);font:inherit;font-weight:bold;box-shadow:0 2px 0 var(--e2)}
.f button:disabled{color:var(--hint)}
.r:active{opacity:1}
.hm{display:block;margin:6px auto 0;border:0;border-radius:999px;padding:9px 18px;background:var(--chip);color:var(--chip-ink);font:inherit;font-weight:bold;box-shadow:0 2px 0 var(--e2)}
.hm:disabled{color:var(--hint)}
.f span{direction:rtl;color:var(--hint);font-size:.85em;white-space:nowrap}
</style>
</head>
<body>
<div class="w" id="m"></div>
<script>
const W=window.TelegramWidget,M=document.getElementById('m');
let S,B,E;
const fa=n=>Number(n).toLocaleString('fa-IR');
const fs=n=>(n/10).toLocaleString('fa-IR',{minimumFractionDigits:1,maximumFractionDigits:1});
const P=s=>{try{return JSON.parse(s)}catch(e){return null}};
function h(t,c,x,p){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e}
function draw(){
 M.textContent='';
 if(!S){h('p','e',E?'خطا در دریافت اطلاعات':'در حال بارگذاری…',M);return}
 h('h3','',S.h,M);
 const L=S.i||[];
 if(!L.length)h('p','e','هنوز متخصصی ثبت نشده است.',M);
 const G=h('div','',null,M);
 L.forEach(x=>{
  const r=h('button','r',null,G);r.dataset.q='o:'+x[4];r.disabled=!!B;
  h('span',x[2]?'p':'p z',x[2]?'⭐ '+fs(x[2]):'بدون امتیاز',r);
  const k=h('div','k',null,r);
  (x[3]||[]).forEach(t=>h('span','',t,k));
  const n=h('div','n',null,r);
  h('div','m',x[0],n);
  if(x[1])h('div','c','📍 '+x[1],n)
 });
 if(E)h('p','x',E==='RATE_LIMITED'?'کمی صبر کنید':'خطا، دوباره امتحان کنید',M);
 if(S.c>1){
  const f=h('div','f',null,M);
  const bt=(l,q,d)=>{const b=h('button','',l,f);b.dataset.q=q;b.disabled=!!d||!!B};
  bt('بعدی','p:'+(S.p+1),S.p>=S.c);h('span','',fa(S.p)+' از '+fa(S.c),f);bt('قبلی','p:'+(S.p-1),S.p<2)
 }
 const hb=h('button','hm','🏠 بازگشت به صفحه اصلی',M);hb.dataset.q='m';hb.disabled=!!B;
}
function ask(d){
 W.request(d).then(a=>{B=0;const s=a.result&&P(a.result);if(s&&d[0]!=='o'&&d!=='m')S=s;draw()},e=>{B=0;E=e.code;draw()});
 B=1;E='';draw()
}
M.addEventListener('click',e=>{
 let t=e.target;
 while(t&&!(t.dataset&&t.dataset.q))t=t.parentNode;
 if(t&&!t.disabled&&W&&!B)ask(t.dataset.q)
});
if(W){
 W.onEvent('chatDataChanged',()=>{const s=P(W.chatData);if(s){S=s;E='';draw()}});
 S=P(W.chatData);draw();
 if(!S)W.request('i').then(a=>{const s=a.result&&P(a.result);if(s){S=s;draw()}},()=>{E='x';draw()});
 W.ready()
}else draw();
</script>
</body>
</html>
